<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="t d" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title id="t">Event lifecycle</title><desc id="d">Four steps: something happens, theAuth signs an event, it is delivered, the receiver acts.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b82f6"/></marker></defs>
<rect width="720" height="240" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
<g font-size="13" text-anchor="middle">
<rect x="24" y="60" width="150" height="120" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="99" cy="88" r="12" fill="#3b82f6"/><text x="99" y="93" fill="#fff" font-weight="700">1</text><text x="99" y="124" font-weight="600" fill="#0f172a">Something happens</text><text x="99" y="146" fill="#64748b" font-size="12">admin bans a user</text><text x="99" y="163" fill="#64748b" font-size="12">or revokes a session</text>
<rect x="196" y="60" width="150" height="120" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="271" cy="88" r="12" fill="#3b82f6"/><text x="271" y="93" fill="#fff" font-weight="700">2</text><text x="271" y="124" font-weight="600" fill="#0f172a">theAuth signs it</text><text x="271" y="146" fill="#64748b" font-size="12">builds a SET and</text><text x="271" y="163" fill="#64748b" font-size="12">queues it per stream</text>
<rect x="368" y="60" width="150" height="120" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="443" cy="88" r="12" fill="#3b82f6"/><text x="443" y="93" fill="#fff" font-weight="700">3</text><text x="443" y="124" font-weight="600" fill="#0f172a">Delivered</text><text x="443" y="146" fill="#64748b" font-size="12">push with retries</text><text x="443" y="163" fill="#64748b" font-size="12">or polled and acked</text>
<rect x="540" y="60" width="156" height="120" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="618" cy="88" r="12" fill="#3b82f6"/><text x="618" y="93" fill="#fff" font-weight="700">4</text><text x="618" y="124" font-weight="600" fill="#0f172a">Receiver acts</text><text x="618" y="146" fill="#64748b" font-size="12">verifies, dedupes,</text><text x="618" y="163" fill="#64748b" font-size="12">revokes sessions</text></g>
<g stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M174 120H194"/><path d="M346 120H366"/><path d="M518 120H538"/></g>
</svg>
