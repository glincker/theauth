name: Release Python SDK

on:
  push:
    tags:
      - "py-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Test Python SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: ./sdks/python
        run: |
          pip install --only-binary :all: hatch
          pip install --only-binary :all: -e ".[dev]"

      - name: Run tests
        working-directory: ./sdks/python
        run: pytest tests/ -v

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test]
    if: needs.test.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build and publish
        working-directory: ./sdks/python
        run: |
          pip install --only-binary :all: hatch
          hatch build
          hatch publish
        env:
          HATCH_INDEX_USER: __token__
          HATCH_INDEX_AUTH: ${{ secrets.PYPI_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-dist
          path: ./sdks/python/dist/*
          retention-days: 30

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: needs.publish.result == 'success'
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: ./artifacts/

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Python SDK ${{ github.ref_name }}"
          files: ./artifacts/*
          body: |
            ## Python SDK Release

            ### Install
            ```bash
            pip install theauth
            ```

            ### What's included
            - Async client (`TheAuthClient`) and sync client (`TheAuthSyncClient`)
            - Agent management, auth, audit, delegation modules
            - Full type hints (mypy strict compatible)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
