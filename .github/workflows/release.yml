name: Release

# Creates the GitHub release (and its tag) for the core version once Publish has succeeded on main.
# Notes are generated from the changesets changelogs by scripts/release-notes.mjs, so every release has a summary,
# a package table and a compare link. Nothing here publishes to npm: that is publish.yml.
on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create or refresh the release for, for example v0.6.0 (uses the core version at the tag, or at main when the tag does not exist yet)
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Work out the tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          TAG="${INPUT_TAG:-v$VERSION}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && [ -z "$INPUT_TAG" ]; then
            echo "Tag $TAG already exists, nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PRE=false
          case "$TAG" in *-*) PRE=true ;; esac
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pre=$PRE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the release notes
        if: steps.meta.outputs.skip == 'false'
        run: node scripts/release-notes.mjs "${{ steps.meta.outputs.tag }}" --sha "${{ steps.meta.outputs.sha }}" > "$RUNNER_TEMP/notes.md"

      - name: Create or update the GitHub release
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
          PRE: ${{ steps.meta.outputs.pre }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "theAuth ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            FLAGS="--latest"
            [ "$PRE" = "true" ] && FLAGS="--prerelease"
            gh release create "$TAG" --target "$SHA" --title "theAuth ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" $FLAGS
          fi

      # Releases and tags made with the default token do not start other workflows, so start the monthly
      # release discussion sync explicitly (workflow_dispatch is the one event allowed to chain).
      - name: Sync the release discussion
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh workflow run release-discussion-caller.yml -f tag="$TAG"
