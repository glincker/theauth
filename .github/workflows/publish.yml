name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance (OIDC token used to sign the attestation).
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # On workflow_run, only publish if CI passed on a push to main of this repo (never a fork PR whose head branch
    # happens to be named main: workflow_run runs with secrets). Tag pushes and manual
    # dispatch always run. The version-diff step is the real guard against
    # double-publishing: if nothing changed it exits cleanly. Tags no longer trigger a publish; Release creates them.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.6.5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships an older npm. pnpm publish hands the upload
      # to the npm binary on PATH, so this is the version that matters.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Informational: surface what's pending so the action summary
      # has a clear "what's about to change" line. Does not gate.
      - name: Report version drift
        run: node scripts/check-versions.mjs || true

      # The list comes from scripts/publishable-packages.mjs (every public workspace package), so a new package is
      # never skipped by accident. The unscoped `theauth` alias is excluded there until it has been published once
      # by hand: a rejected first publish would fail the whole run.
      - name: Detect changed packages
        id: detect
        run: |
          PACKAGES=$(node scripts/publishable-packages.mjs | tr '\n' ' ')
          echo "Checking $(echo $PACKAGES | wc -w | tr -d ' ') public packages"

          # Parallel: for each package, compare local pkg.json version to the
          # published version on npm. Emit "<dir>" for any package that needs
          # publishing. `npm view ... version` is a fast HEAD-style request;
          # running them concurrently keeps this step under 5s for ~25 pkgs.
          to_publish=""
          probe() {
            local dir="$1"
            [ -f "$dir/package.json" ] || return 0
            local name local_version published
            name=$(node -p "require('./$dir/package.json').name")
            local_version=$(node -p "require('./$dir/package.json').version")
            published=$(npm view "$name" version 2>/dev/null || echo "")
            if [ "$local_version" != "$published" ]; then
              echo "$dir|$name|$local_version|${published:-none}"
            fi
          }
          export -f probe

          changed=$(printf '%s\n' $PACKAGES | xargs -P 8 -n 1 -I {} bash -c 'probe "$@"' _ {})

          if [ -z "$changed" ]; then
            echo "✓ No packages need publishing — all versions match npm registry."
            echo "changed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "── Packages to publish ──"
          echo "$changed" | column -t -s '|' -N 'DIR,NAME,LOCAL,PUBLISHED'

          # Pass dirs to next step via output (one per line, joined with %0A for set-output).
          dirs=$(echo "$changed" | cut -d'|' -f1 | tr '\n' ' ')
          echo "changed_dirs=$dirs" >> "$GITHUB_OUTPUT"

      # Build only the packages that will publish (and their workspace deps).
      # Uses turbo's cache so unchanged transitive deps are instant.
      - name: Build changed packages
        if: steps.detect.outputs.changed_dirs != ''
        run: |
          # Convert "packages/foo packages/bar" → "--filter=./packages/foo... --filter=./packages/bar..."
          filters=""
          for d in ${{ steps.detect.outputs.changed_dirs }}; do
            filters="$filters --filter=./$d..."
          done
          pnpm turbo build $filters

      # `id-token: write` above gives npm the OIDC identity for trusted publishing and for the provenance attestation
      # (pnpm delegates the upload to npm). Failures are NOT swallowed. The only tolerated case is a
      # version that is already on the registry, which is checked explicitly per package before publishing.
      - name: Publish changed packages
        if: steps.detect.outputs.changed_dirs != ''
        env:
          # No NODE_AUTH_TOKEN: each package has a trusted publisher on npmjs.com (repo glincker/theauth, workflow
          # publish.yml), so npm swaps the job's OIDC token for a short-lived publish credential. Nothing to expire.
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          for dir in ${{ steps.detect.outputs.changed_dirs }}; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "✓ $name@$version is already published, skipping"
              continue
            fi
            # Only packages with a build script produce dist/ (the theauth alias is a plain forwarder with no build).
            if [ -n "$(node -p "require('./$dir/package.json').scripts?.build ?? ''")" ] && [ ! -d "$dir/dist" ]; then
              echo "✗ $dir has no dist/ - build step likely failed"
              exit 1
            fi
            echo "▲ Publishing $name@$version"
            (cd "$dir" && pnpm publish --access public --no-git-checks)
          done
