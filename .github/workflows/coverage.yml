name: coverage

on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core:
    # Core only: one package, no turbo, no builds. Other packages can be added as flags later.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets codecov-action authenticate with a GitHub OIDC token when no CODECOV_TOKEN secret is set.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.6.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline --filter @glinr/theauth...

      - name: Test with coverage
        run: pnpm --filter @glinr/theauth exec vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text-summary

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: packages/core/coverage/lcov.info
          flags: core
          token: ${{ secrets.CODECOV_TOKEN }}
          # Token wins when the secret exists, otherwise fall back to tokenless OIDC.
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          # Surface upload failures on pushes to main instead of hiding them.
          fail_ci_if_error: ${{ github.event_name == 'push' }}
