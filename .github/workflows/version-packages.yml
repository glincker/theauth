name: version-packages

on:
  push:
    branches: [main]

concurrency:
  group: version-packages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # GLINR_BOT_TOKEN (org secret, fine-grained PAT or GitHub App) is needed so the tag
      # pushed below triggers release.yml. Tags pushed with the default
      # GITHUB_TOKEN do not start other workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GLINR_BOT_TOKEN || github.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.6.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --prefer-offline

      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GLINR_BOT_TOKEN || github.token }}

      # Tag only when the merge commit is the version PR itself, so an
      # already-bumped but unreleased version never ships by accident.
      - name: Tag release after version PR merge
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          case "$HEAD_MESSAGE" in
            "chore: version packages"*) ;;
            *) echo "Head commit is not a version PR merge, skipping tag."; exit 0 ;;
          esac
          VERSION=$(node -p "require('./packages/core/package.json').version")
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
