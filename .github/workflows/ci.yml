name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "docs-local/**"
  # No paths-ignore here: `ci` is a required status check, and a workflow that never starts would leave it pending
  # forever on docs-only PRs. The `changes` job below already skips the heavy job when nothing relevant changed.
  pull_request:
    branches: [main]
  # Nightly full run on main (every package, not only the ones a PR touched).
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # Scheduled and manual runs always do the full job, so they skip the diff.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            run_ci:
              - "packages/**"
              - "examples/**"
              - "sdks/**"
              - "scripts/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "biome.json"
              - ".github/workflows/ci.yml"
              - ".github/workflows/release.yml"
              - ".github/workflows/publish.yml"

  ci:
    needs: changes
    # `!cancelled()` lets this run on schedule/dispatch, where `changes` is skipped.
    if: >-
      ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.run_ci == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.6.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      # On PRs, only packages changed against main and their dependents run. Push to main and the
      # nightly schedule run everything. Lint always runs in full (biome is fast).
      - name: Build (affected)
        if: github.event_name == 'pull_request'
        run: pnpm exec turbo run build --filter='...[origin/main]'

      - name: Build
        if: github.event_name != 'pull_request'
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck (affected)
        if: github.event_name == 'pull_request'
        run: pnpm exec turbo run typecheck --filter='...[origin/main]'

      - name: Typecheck
        if: github.event_name != 'pull_request'
        run: pnpm typecheck

      - name: Test (affected)
        if: github.event_name == 'pull_request'
        run: pnpm test:affected

      - name: Test
        if: github.event_name != 'pull_request'
        run: pnpm test:all
